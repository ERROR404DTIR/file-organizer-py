<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">File Organizer</title><desc id="d">Loose files are sorted into organized folders.</desc><defs><linearGradient id="bg"><stop stop-color="#1b2b3b"/><stop offset="1" stop-color="#0a111d"/></linearGradient></defs><rect width="1200" height="300" rx="24" fill="url(#bg)"/><g fill="#182c42" stroke="#8fa8ff" stroke-width="2"><path d="M95 108H205L225 128H340V220H95Z"/><path d="M405 108H515L535 128H650V220H405Z"/><path d="M715 108H825L845 128H960V220H715Z"/></g><g fill="#edf3ff" font-family="monospace" font-size="15" text-anchor="middle"><text x="217" y="177">IMAGES</text><text x="527" y="177">DOCUMENTS</text><text x="837" y="177">ARCHIVES</text></g><g fill="#62e3c1"><rect x="480" y="45" width="26" height="32" rx="4"><animate attributeName="y" values="45;85;45" dur="2.8s" repeatCount="indefinite"/></rect><rect x="535" y="45" width="26" height="32" rx="4"><animate attributeName="y" values="85;45;85" dur="2.8s" repeatCount="indefinite"/></rect></g><path d="M340 165H405M650 165H715" stroke="#62e3c1" stroke-width="3" stroke-dasharray="8 8"><animate attributeName="stroke-dashoffset" values="0;-64" dur="2s" repeatCount="indefinite"/></path><text x="58" y="48" fill="#edf3ff" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="5">FILE ORGANIZER</text><text x="1140" y="48" text-anchor="end" fill="#91a0ba" font-family="monospace" font-size="13" letter-spacing="3">SORT / GROUP / RESTORE</text></svg>