<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200" role="img" aria-label="File Organizer animation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="200" rx="16" fill="url(#bg)"/>

  <text x="400" y="52" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#e2e8f0">
    File Organizer
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </text>
  <text x="400" y="76" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#94a3b8">zero dependencies · one python file</text>

  <!-- folders -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="600">
    <g transform="translate(470,120)"><path d="M0 8 h26 l8 10 h62 v52 h-96z" fill="#38bdf8"/><text x="48" y="58">Images</text></g>
    <g transform="translate(590,120)"><path d="M0 8 h26 l8 10 h62 v52 h-96z" fill="#a78bfa"/><text x="48" y="58">Documents</text></g>
    <g transform="translate(680,120)"><path d="M0 8 h26 l8 10 h62 v52 h-96z" fill="#34d399" transform="scale(0.8)"/><text x="38" y="52">Audio</text></g>
  </g>

  <!-- messy files moving into folders -->
  <g>
    <rect width="26" height="32" rx="4" fill="#38bdf8">
      <animateMotion dur="3.2s" repeatCount="indefinite" path="M60,140 C200,40 360,60 500,150"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.85;0.95;1" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <rect width="26" height="32" rx="4" fill="#a78bfa">
      <animateMotion dur="3.2s" begin="0.8s" repeatCount="indefinite" path="M40,100 C220,20 420,40 620,150"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.85;0.95;1" dur="3.2s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect width="26" height="32" rx="4" fill="#34d399">
      <animateMotion dur="3.2s" begin="1.6s" repeatCount="indefinite" path="M90,160 C260,60 480,90 700,150"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.85;0.95;1" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
